# pkg_media: the media library's client (HTTP and gRPC transports), its consumer
# helpers, and the fritill.media.v1 gRPC contract (protos, committed stubs,
# servicer base classes, wire-path and reason constants). The media server
# installs it for the contract; app backends install it for the client.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkg-media"
# Single source of truth: __version__ in src/pkg_media/__init__.py, rewritten by
# .github/workflows/release.yml and read here by [tool.hatch.version].
dynamic = ["version"]
description = "Client, helpers and gRPC contract (fritill.media.v1) for the ITQ media library"
readme = "README.md"
# A package floor, not a service runtime: consumers pick their interpreter.
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
  # Hard stop: PyPI rejects any distribution carrying a "Private ::" classifier.
  "Private :: Do Not Upload",
]

# The base install is the HTTP client and its helpers. Codegen tools
# (grpcio-tools, mypy-protobuf) never go anywhere here: stubs are generated in
# this repo and committed (tests/test_packaging.py).
dependencies = [
    "httpx>=0.25.0,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
# The gRPC transport and the contract (pkg_media.contract, .reasons, the stubs):
# app backends on gRPC and the media server install it.
grpc = [
    "protobuf>=7.35.1,<8",
    "grpcio>=1.84.0",
    # Rich errors: google.rpc.ErrorInfo in the status details (AD-10).
    "grpcio-status>=1.84.0",
    "googleapis-common-protos>=1.75.5",
]
# The resolve, grant and upload routers (pkg_media.integrations.fastapi).
fastapi = ["fastapi>=0.100"]

[dependency-groups]
# `build` is needed by tests/test_packaging.py (it builds a real wheel);
# without it those tests skip.
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "fastapi>=0.100",
    "build>=1.2",
    "hatchling",
    "packaging",
    # The grpc extra's packages, so the whole suite runs.
    "protobuf>=7.35.1,<8",
    "grpcio>=1.84.0",
    "grpcio-status>=1.84.0",
    "googleapis-common-protos>=1.75.5",
]
# Separate from `dev` on purpose: nothing installs the compiler by accident.
# `uv sync --all-groups` takes it (CI, and anyone running tools/generate.py).
codegen = [
    "grpcio-tools==1.84.0",
    "mypy-protobuf==5.1.0",
]

[tool.uv]
default-groups = ["dev", "codegen"]

[tool.hatch.version]
path = "src/pkg_media/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pkg_media"]

[tool.hatch.build.targets.sdist]
include = ["src/pkg_media", "proto/fritill", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
