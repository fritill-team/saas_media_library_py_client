// Delivery: slim assets with download, preview and stream links.
//
// A service caller resolves every asset of its app, RESTRICTED included; the
// service decides which of its users get the links (its resolve router runs
// its own can_access first). Links expire: see each *_expires_in (seconds;
// unset means the link does not expire).
//
// Refusals (ErrorInfo.domain = "itqadem.media.v1.Delivery"), besides the
// common ones in common.proto:
//
// | reason | status | kind |
// | --- | --- | --- |
// | asset_not_found | NOT_FOUND | permanent |
// | blob_not_found | NOT_FOUND | permanent |
// | tenant_storage_not_found | NOT_FOUND | permanent |
//
// `blob_not_found`: the asset exists but its file does not (no blob, or the
// blob was removed), so there is nothing to link to.
// `tenant_storage_not_found`: media has no R2 storage configured for the
// app (an operator fixes it; retrying does not help).
//
// ResolveDeliveryAssets never refuses an id: each item carries its status.

syntax = "proto3";

package itqadem.media.v1;

service Delivery {
  // Assets of the app, paged, without links. Read-only.
  rpc ListDeliveryAssets(ListDeliveryAssetsRequest) returns (ListDeliveryAssetsResponse);
  // One asset with its links. Read-only.
  rpc GetDeliveryAsset(GetDeliveryAssetRequest) returns (GetDeliveryAssetResponse);
  // Links for up to 100 assets, one item per id in request order. Read-only.
  rpc ResolveDeliveryAssets(ResolveDeliveryAssetsRequest) returns (ResolveDeliveryAssetsResponse);
}

message DeliveryRenditionVariant {
  string name = 1;
  optional int32 width = 2;
  optional int32 height = 3;
  optional int32 bitrate_kbps = 4;
  optional string preview_url = 5;
  optional string preview_url_type = 6;
  optional int32 preview_url_expires_in = 7;
}

message DeliveryRendition {
  string id = 1;
  string rendition_type = 2;
  string status = 3;
  string entrypoint = 4;
  optional double duration_seconds = 5;
  repeated DeliveryRenditionVariant variants = 6;
  optional string language = 7;
  optional string preview_url = 8;
  optional string preview_url_type = 9;
  optional int32 preview_url_expires_in = 10;
}

message DeliveryAsset {
  string id = 1;
  string kind = 2;
  optional string title = 3;
  string status = 4;
  string visibility = 5;
  string mime_type = 6;
  // "gate" | "unavailable".
  string download_type = 7;
  optional string download_url = 8;
  optional int32 download_url_expires_in = 9;
  repeated DeliveryRendition renditions = 10;
  optional string hls_url = 11;
  optional string dash_url = 12;
  optional int32 stream_url_expires_in = 13;
}

message ListDeliveryAssetsRequest {
  optional string kind = 1;
  optional string status = 2;
  optional string query = 3;
  // 1-based; 0 means 1.
  int32 page = 4;
  // 1 to 100; 0 means 10.
  int32 page_size = 5;
}

message ListDeliveryAssetsResponse {
  repeated DeliveryAsset items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetDeliveryAssetRequest {
  string asset_id = 1;
}

message GetDeliveryAssetResponse {
  DeliveryAsset asset = 1;
}

message ResolveDeliveryAssetsRequest {
  // 1 to 100 ids.
  repeated string asset_ids = 1;
}

message ResolveDeliveryAssetsItem {
  string asset_id = 1;
  // "ok" | "not_found" | "forbidden" | "error".
  string status = 2;
  // A public thumbnail link, also for "forbidden" and "error" items.
  optional string thumbnail_url = 3;
  // Set when status is "ok".
  DeliveryAsset asset = 4;
  optional string error = 5;
}

message ResolveDeliveryAssetsResponse {
  repeated ResolveDeliveryAssetsItem items = 1;
  int32 total = 2;
}
